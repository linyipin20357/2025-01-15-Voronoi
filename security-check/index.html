<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxVin酒標驗證平台</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            background: url('LUX.png') no-repeat center center fixed;
            background-size: cover;
            color: #5a3e36;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2em;
        }
        #container {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90%;
            width: 400px;
        }
        img {
            max-width: 80%;
            height: auto;
            border: 3px solid #5a3e36;
            border-radius: 5px;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            #container {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>QR Code 掃描結果</h1>
        <p>NO: <span id="noDisplay">未提供</span></p>
        <img id="picDisplay" src="" alt="圖片載入中..." style="display: none;">
    </div>

    <script>
        // 定義 NO 與 PIC 的對應關係
        const dataMap = {
            "A00001": "A00001.jpg",
            "A00002": "A00002.jpg",
            "A00003": "A00003.jpg",
            "A00004": "A00004.jpg",
            "A00005": "A00005.jpg",
            "A00006": "A00006.jpg",
            "A00007": "A00007.jpg",
            "A00008": "A00008.jpg",
            "A00009": "A00009.jpg",
            "A00010": "A00010.jpg"
        };

        // 取得網址參數
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // 取得 NO 參數
        const noValue = getQueryParam("no");

        if (noValue && dataMap[noValue]) {
            document.getElementById("noDisplay").innerText = noValue;
            const imgElement = document.getElementById("picDisplay");
            imgElement.src = dataMap[noValue];  // 設定圖片
            imgElement.style.display = "block"; // 顯示圖片
        } else {
            document.getElementById("noDisplay").innerText = "查無此編號";
        }
    </script>
</body>
</html>
